<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
</head>
<body style="background:#111;color:#fff;padding:20px;font-family:sans-serif">
<h2>Test Giris</h2>
<input id="email" type="email" placeholder="email" style="display:block;width:100%;padding:10px;margin:8px 0;font-size:16px;background:#222;color:#fff;border:1px solid #444;border-radius:6px">
<input id="sifre" type="password" placeholder="sifre" style="display:block;width:100%;padding:10px;margin:8px 0;font-size:16px;background:#222;color:#fff;border:1px solid #444;border-radius:6px">
<button onclick="giris()" style="background:orange;color:#000;padding:14px;font-size:18px;border:none;border-radius:8px;width:100%;margin-top:8px">GİRİŞ YAP</button>
<div id="msg" style="margin-top:16px;font-size:13px;color:yellow;word-break:break-all;white-space:pre-wrap"></div>

<script>
var sb = supabase.createClient(
  'https://vdkhbhalekogrwabmknn.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZka2hiaGFsZWtvZ3J3YWJta25uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzU0MTcsImV4cCI6MjA5NjA1MTQxN30.wthgax016okxpwUGUwNQlY_IJ132uAebCjV0YLNCHs0'
);

function log(txt){ document.getElementById('msg').textContent = txt; }

async function giris(){
  log('1) Baslatiliyor...');
  var email = document.getElementById('email').value.trim();
  var sifre = document.getElementById('sifre').value;
  if(!email||!sifre){ log('Email ve sifre gir!'); return; }
  log('2) Supabase cagiriliyor...\nemail: '+email);
  try {
    var r = await sb.auth.signInWithPassword({email:email, password:sifre});
    if(r.error){
      log('HATA:\n' + JSON.stringify(r.error, null, 2));
    } else {
      log('BASARILI!\nKullanici: ' + r.data.user.email);
    }
  } catch(e) {
    log('EXCEPTION: ' + e.message);
  }
}
</script>
</body>
</html>
